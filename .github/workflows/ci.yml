name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt pyflakes

      - name: Compile
        run: python -m compileall -q custom_components scripts tests conftest.py

      - name: Lint
        run: python -m pyflakes custom_components/cactus_home/*.py scripts/*.py tests/*.py conftest.py

      - name: Validate integration JSON
        run: |
          for f in custom_components/cactus_home/manifest.json \
                   custom_components/cactus_home/strings.json \
                   custom_components/cactus_home/translations/en.json \
                   hacs.json; do
            python -c "import json; json.load(open('$f'))"
          done

      - name: Test
        run: python -m pytest -q
